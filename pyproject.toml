[project]
name = "openai-compatible-api"
version = "0.1.0"
description = "OpenAI-compatible API for embeddings and reranking."
authors = [{name = "Jules", email = "jules@example.com"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.117.0",
    "uvicorn[standard]>=0.35.0,<0.36.0",
    "pydantic>=2.11.9,<3.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "numpy>=2.3.3",
    "sentence-transformers>=2.7.0",
    "torch>=2.3.1",
    "protobuf (>=6.33.5,<7.0.0)",
    "sentencepiece (>=0.2.1,<0.3.0)",
    "gunicorn (>=25.0.3,<26.0.0)",
    "httpx>=0.28.1",
    "starlette>=0.49.1",
    "urllib3>=2.7.0",
    "werkzeug>=3.1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "locust>=2.40.4",
    "gunicorn",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
