version: '3.8'

services:
  api-cpu:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    image: embedding_jp_api-cpu
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - API_KEY=${API_KEY}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-2}
      - OFFLINE_MODE=${OFFLINE_MODE:-false}
      - HF_HOME=/home/appuser/.cache/huggingface
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - TOKENIZERS_PARALLELISM=false
    volumes:
      - ./.cache/models:/home/appuser/.cache/huggingface
    restart: always

  api-gpu:
    build:
      context: .
      dockerfile: Dockerfile
    image: embedding_jp_api-gpu
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - API_KEY=${API_KEY}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-2}
      - OFFLINE_MODE=${OFFLINE_MODE:-false}
      - HF_HOME=/home/appuser/.cache/huggingface
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - TOKENIZERS_PARALLELISM=false
    volumes:
      - ./.cache/models:/home/appuser/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    restart: always
